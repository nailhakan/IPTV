name: macOS build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/iptv_app.app iptv-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-macos
          path: iptv-macos.zip
